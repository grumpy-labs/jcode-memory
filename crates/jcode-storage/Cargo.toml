[package]
name = "jcode-storage"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
dirs = "5"
duckdb = { version = "1.10502.0", optional = true, default-features = false }
jcode-core = { path = "../jcode-core" }
libc = "0.2"
rand = "0.9.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = []
duckdb-storage = ["dep:duckdb"]
duckdb-storage-bundled = ["duckdb-storage", "duckdb/bundled"]
